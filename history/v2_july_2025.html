<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PyLearner — Learn Python with AI</title>
    <style>
        /* ========================================================
           СТИЛИ — Я ИХ ПЕРЕПИСЫВАЛА 3 РАЗА, ПОКА НЕ ПОНРАВИЛОСЬ
           Сейчас нравится, но может, потом поменяю на тёмно-зелёный?
           ======================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 1rem;
        }
        .app {
            max-width: 1000px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header-left h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .lang-switch {
            display: flex;
            gap: 0.2rem;
            background: #0f172a;
            border-radius: 30px;
            padding: 0.15rem;
            border: 1px solid #334155;
        }
        .lang-switch button {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-switch button.active {
            background: #3b82f6;
            color: white;
        }
        .lang-switch button:hover:not(.active) {
            color: white;
        }
        .badge {
            background: #334155;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .badge span {
            color: #60a5fa;
            font-weight: 700;
        }
        .achievements-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            background: #0f172a;
            padding: 0.5rem 1rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            align-items: center;
        }
        .achievements-bar .label {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-right: 0.3rem;
        }
        .achievement {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            background: #1e293b;
            padding: 0.15rem 0.6rem 0.15rem 0.3rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #94a3b8;
            border: 1px solid #334155;
            transition: 0.3s;
        }
        .achievement.unlocked {
            border-color: #fbbf24;
            color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.12);
        }
        .achievement .icon {
            font-size: 1rem;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 1.5rem;
        }
        @media (max-width: 800px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .lesson-nav {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1.2rem;
            flex-wrap: nowrap;
            scrollbar-width: thin;
        }
        .lesson-nav button {
            background: #334155;
            border: none;
            color: #94a3b8;
            padding: 0.3rem 0.8rem;
            border-radius: 10px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            font-weight: 500;
            flex-shrink: 0;
        }
        .lesson-nav button.active {
            background: #3b82f6;
            color: white;
        }
        .lesson-nav button.done {
            border: 2px solid #22c55e;
        }
        .lesson-nav button:hover:not(.active) {
            background: #475569;
            color: white;
        }
        .lesson-content {
            background: #0f172a;
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
        }
        .lesson-content h2 {
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
            color: #f1f5f9;
        }
        .lesson-content .theory {
            color: #cbd5e1;
            line-height: 1.7;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
            white-space: pre-wrap;
        }
        .lesson-content .theory code {
            background: #1e293b;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            color: #a78bfa;
            font-size: 0.85rem;
        }
        .lesson-content .example {
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            padding: 0.6rem 1rem;
            border-radius: 0 8px 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 0.8rem;
            color: #e2e8f0;
        }
        .tasks-section {
            margin-top: 1rem;
        }
        .task-item {
            background: #1e293b;
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.5rem;
            border-left: 3px solid #334155;
            transition: 0.2s;
        }
        .task-item.bonus {
            border-left-color: #8b5cf6;
            opacity: 0.85;
        }
        .task-item.completed {
            border-left-color: #22c55e;
            background: #0f2a1a;
        }
        .task-item .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .task-item .task-text {
            font-size: 0.85rem;
            color: #e2e8f0;
            flex: 1;
        }
        .task-item .task-text code {
            background: #0f172a;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            color: #a78bfa;
            font-size: 0.8rem;
        }
        .task-item .task-status {
            font-size: 0.65rem;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            background: #334155;
            color: #94a3b8;
            white-space: nowrap;
        }
        .task-item .task-status.done {
            background: #064e3b;
            color: #86efac;
        }
        .task-item .task-status.bonus-label {
            background: #2e1065;
            color: #a78bfa;
        }
        .task-item .task-actions {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.3rem;
            flex-wrap: wrap;
        }
        .task-item .task-actions .btn-sm {
            padding: 0.15rem 0.6rem;
            border: none;
            border-radius: 6px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-sm.primary {
            background: #3b82f6;
            color: white;
        }
        .btn-sm.primary:hover {
            background: #2563eb;
        }
        .btn-sm.success {
            background: #22c55e;
            color: white;
        }
        .btn-sm.success:hover {
            background: #16a34a;
        }
        .btn-sm.secondary {
            background: #334155;
            color: #94a3b8;
        }
        .btn-sm.secondary:hover {
            background: #475569;
            color: white;
        }
        .btn-sm.ai-hint {
            background: #7c3aed;
            color: white;
        }
        .btn-sm.ai-hint:hover {
            background: #6d28d9;
        }
        .task-item .task-input {
            width: 100%;
            min-height: 44px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            padding: 0.4rem;
            resize: vertical;
            outline: none;
            transition: border 0.2s;
            margin-top: 0.3rem;
        }
        .task-item .task-input:focus {
            border-color: #3b82f6;
        }
        .task-item .task-input:disabled {
            opacity: 0.6;
        }
        .task-item .task-result {
            margin-top: 0.3rem;
            font-size: 0.75rem;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            display: none;
        }
        .task-item .task-result.show {
            display: block;
        }
        .task-item .task-result.success {
            background: #064e3b;
            color: #86efac;
            border: 1px solid #22c55e;
        }
        .task-item .task-result.error {
            background: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #ef4444;
        }
        .task-item .task-result.hint {
            background: #1e1b4b;
            color: #a78bfa;
            border: 1px solid #7c3aed;
        }
        .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin: 0.8rem 0;
        }
        .btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #334155;
            color: #94a3b8;
        }
        .btn-secondary:hover {
            background: #475569;
            color: white;
        }
        .btn-ai {
            background: #7c3aed;
            color: white;
        }
        .btn-ai:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .progress-bar-wrap {
            background: #334155;
            border-radius: 20px;
            height: 5px;
            overflow: hidden;
            margin-top: 0.8rem;
        }
        .progress-bar-wrap .fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a78bfa);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 20px;
        }
        .main-result {
            padding: 0.5rem 0.8rem;
            border-radius: 10px;
            margin: 0.3rem 0 0;
            font-size: 0.85rem;
            display: none;
        }
        .main-result.success {
            display: block;
            background: #064e3b;
            border: 1px solid #22c55e;
            color: #86efac;
        }
        .main-result.error {
            display: block;
            background: #7f1d1d;
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .main-result.show {
            display: block;
        }
        .ai-sidebar {
            background: #0f172a;
            border-radius: 16px;
            padding: 0.8rem;
            height: fit-content;
            position: sticky;
            top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .ai-sidebar h3 {
            font-size: 0.9rem;
            color: #a78bfa;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .ai-sidebar h3 span {
            font-size: 1.1rem;
        }
        .ai-chat {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 350px;
            overflow-y: auto;
        }
        .ai-message {
            padding: 0.4rem 0.6rem;
            border-radius: 10px;
            font-size: 0.8rem;
            line-height: 1.5;
            max-width: 95%;
            white-space: pre-wrap;
        }
        .ai-message.bot {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }
        .ai-message.bot code {
            background: #0f172a;
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            color: #a78bfa;
            font-size: 0.75rem;
        }
        .ai-message.user {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }
        .ai-input-row {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.2rem;
        }
        .ai-input-row input {
            flex: 1;
            padding: 0.4rem 0.6rem;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 0.8rem;
            outline: none;
            transition: border 0.2s;
        }
        .ai-input-row input:focus {
            border-color: #7c3aed;
        }
        .ai-input-row input::placeholder {
            color: #64748b;
        }
        .ai-input-row button {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .ai-input-row button:hover {
            background: #6d28d9;
        }
        .ai-quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.1rem;
        }
        .ai-quick-actions button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.15rem 0.5rem;
            border-radius: 30px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .ai-quick-actions button:hover {
            background: #334155;
            color: white;
            border-color: #7c3aed;
        }

        @media (max-width: 600px) {
            .app {
                padding: 0.8rem;
            }
            .header-left h1 {
                font-size: 1.1rem;
            }
            .lesson-content {
                padding: 0.8rem;
            }
            .task-item {
                padding: 0.4rem;
            }
            .btn {
                padding: 0.3rem 0.7rem;
                font-size: 0.7rem;
            }
            .ai-sidebar {
                position: static;
            }
            .main-grid {
                gap: 0.8rem;
            }
            .ai-chat {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ========================================================
        ШАПКА — ТУТ ВСЁ ПРОСТО, НО Я ДОЛГО ДУМАЛА НАД ЦВЕТОМ
        ======================================================== -->
        <div class="header">
            <div class="header-left">
                <h1>🐍 PyLearner AI</h1>
            </div>
            <div class="header-right">
                <div class="lang-switch" id="langSwitch">
                    <button data-lang="ru" class="active">🇷🇺 RU</button>
                    <button data-lang="en">🇬🇧 EN</button>
                </div>
                <div class="badge">🎯 XP: <span id="xpDisplay">0</span></div>
                <div class="badge">📚 <span id="currentLessonNum">1</span>/<span id="totalLessons">10</span></div>
            </div>
        </div>

        <!-- ========================================================
        ДОСТИЖЕНИЯ — Я ИХ ПРИДУМАЛА, КОГДА СКУЧАЛА НА УРОКЕ
        ======================================================== -->
        <div class="achievements-bar" id="achievementsBar">
            <span class="label" data-i18n="achievements">🏆 Достижения:</span>
            <div class="achievement" id="achFirstBlood"><span class="icon">⚡</span> First Blood</div>
            <div class="achievement" id="achPerfectionist"><span class="icon">💎</span> Perfectionist</div>
            <div class="achievement" id="achSpeedDemon"><span class="icon">🔥</span> Speed Demon</div>
            <div class="achievement" id="achScholar"><span class="icon">📖</span> Scholar</div>
            <div class="achievement" id="achMaster"><span class="icon">👑</span> Master</div>
        </div>

        <!-- ========================================================
        ОСНОВНАЯ СЕТКА: УРОКИ + AI-ПОМОЩНИК
        ======================================================== -->
        <div class="main-grid">
            <!-- ЛЕВАЯ КОЛОНКА: УРОКИ -->
            <div>
                <div class="lesson-nav" id="lessonNav"></div>
                <div class="lesson-content" id="lessonContent">
                    <h2 id="lessonTitle">Variables</h2>
                    <div class="theory" id="lessonTheory"></div>
                    <div class="example" id="lessonExample"></div>
                    <div class="tasks-section" id="tasksContainer"></div>
                </div>
                <div class="main-result" id="mainResult"></div>
                <div class="actions">
                    <button class="btn btn-secondary" id="resetBtn" data-i18n="reset">↺ Сбросить всё</button>
                    <button class="btn btn-success" id="nextBtn" disabled data-i18n="next">→ Следующий урок</button>
                </div>
                <div class="progress-bar-wrap">
                    <div class="fill" id="progressFill"></div>
                </div>
            </div>

            <!-- ПРАВАЯ КОЛОНКА: AI-ПОМОЩНИК -->
            <div class="ai-sidebar">
                <h3><span>🤖</span> <span data-i18n="ai_tutor">AI-помощник</span></h3>
                <div class="ai-chat" id="aiChat">
                    <div class="ai-message bot" data-i18n="ai_welcome">
                        👋 Привет! Я твой AI-помощник. Спрашивай подсказки, объяснения, или скажи, что хочешь изучить — я составлю план!
                    </div>
                </div>
                <div class="ai-quick-actions">
                    <button data-hint="hint" data-i18n="hint">💡 Подсказка</button>
                    <button data-hint="explain" data-i18n="explain">📖 Объяснить</button>
                    <button data-hint="plan" data-i18n="plan">📋 План</button>
                    <button data-hint="fix" data-i18n="fix">🔧 Исправить</button>
                </div>
                <div class="ai-input-row">
                    <input type="text" id="aiInput" data-i18n-placeholder="ask_ai" placeholder="Спроси AI о чём угодно..." />
                    <button id="aiSendBtn" data-i18n="send">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  ПЕРЕВОДЫ — Я ИХ ДЕЛАЛА С ПОМОЩЬЮ ГУГЛ-ПЕРЕВОДЧИКА, 
        //  ПОТОМ РУКАМИ ИСПРАВЛЯЛА, ПОЭТОМУ МОГУТ БЫТЬ ОШИБКИ :)
        // ================================================================

                wrong: '❌ Не совсем. Проверь синтаксис (кавычки, пробелы, двоеточия).',

                cant_reset: '⚠️ Обязательную задачу нельзя сбросить (я так придумала, чтобы ты не жульничала)',
                main_done: '✅ Обязательная задача решена! Можешь переходить к следующему уроку или решать дополнительные (они необязательные, но полезные!).',

                plan_prompt: 'Помоги мне изучить',
                i_know: 'я знаю',
            },
            en: {

                reset: '↺ Reset All',

                ai_tutor: 'AI Tutor',
                ai_welcome: '👋 Hi! I\'m your AI tutor. Ask me for hints, explain concepts, or tell me what you want to learn and I\'ll build a plan for you!',
                hint: '💡 Hint',
                explain: '📖 Explain',

        function extractGoalFromQuery(q) {
            const goalKeywords = {
                'dfs': 'dfs',
                'граф': 'графы',
                'graph': 'графы',
                'рекурс': 'рекурсия',
                'recursion': 'рекурсия',

                'class': 'классы',
                'ооп': 'ооп',
                'файл': 'работа с файлами',
                'file': 'работа с файлами',
                'исключени': 'исключения',
                'exception': 'исключения',
                'библиотек': 'библиотеки',
                'library': 'библиотеки',
                'list': 'списки',
                'dict': 'словари',
                'словар': 'словари',
                'цикл': 'циклы for',
                'loop': 'циклы for',
                'услови': 'условия',
                'if': 'условия',
                'функци': 'функции',
                'function': 'функции',
            };

            for (const [key, value] of Object.entries(goalKeywords)) {
                if (q.includes(key)) {
                    return value;
                }
            }
            return null;
        }

        function extractKnownTopicsFromQuery(q, lang) {
            const known = [];
            const topicNames = lang === 'ru' ?
                ['переменные', 'типы данных', 'условия', 'циклы for', 'циклы while', 'функции', 'списки', 'словари',
                    'строки', 'алгоритмы'
                ] :
                ['variables', 'data types', 'conditions', 'for loops', 'while loops', 'functions', 'lists', 'dictionaries',
                    'strings', 'algorithms'
                ];

            for (const topic of topicNames) {
                if (q.includes(topic)) {
                    known.push(topic);
                }
            }

            if (q.includes('знаю') || q.includes('know')) {
                const parts = q.split(/знаю|know|уже знаю|already know/i);
                if (parts.length > 1) {
                    const knownPart = parts[1].toLowerCase();
                    for (const topic of topicNames) {
                        if (knownPart.includes(topic)) {
                            if (!known.includes(topic)) known.push(topic);
                        }
                    }
                }
            }

            return known;
        }

        function getPrerequisitesForTopic(topic) {
            if (TOPIC_PREREQUISITES[topic]) {
                let result = [];
                const direct = TOPIC_PREREQUISITES[topic];
                for (const prereq of direct) {
                    result.push(prereq);
                    const subPrereqs = getPrerequisitesForTopic(prereq);
                    for (const sub of subPrereqs) {
                        if (!result.includes(sub)) {
                            result.push(sub);
                        }
                    }
                }
                return result;
            }
            return [];
        }

                const uniquePath = [];

                    if (!uniquePath.includes(item)) {
                        uniquePath.push(item);
                    }
                }

                const sortedPath = uniquePath.sort((a, b) => {
                    const numA = TOPIC_LESSON_MAP[a] || 99;
                    const numB = TOPIC_LESSON_MAP[b] || 99;

        function generatePlan(query) {
            const lang = getLang();
            const q = query.toLowerCase();

            const goal = extractGoalFromQuery(q);
            if (!goal) {
                return lang === 'ru' ?
                    '🤔 Я не поняла, что именно ты хочешь изучить. Напиши, например: *"Хочу изучить DFS"* или *"Помоги разобраться с рекурсией"*.' :
                    '🤔 I didn\'t understand what you want to learn. Write, for example: *"I want to learn DFS"* or *"Help me understand recursion"*.';
            }

            let knownTopics = extractKnownTopicsFromQuery(q, lang);

            const prerequisites = getPrerequisitesForTopic(goal);
            const missingTopics = prerequisites.filter(t => !knownTopics.includes(t));

            return buildPlanResponse(goal, knownTopics, missingTopics, lang);
        }

            nav.innerHTML = '';
            LESSONS_DATA.forEach((lesson, index) => {
                const btn = document.createElement('button');
                btn.textContent = `${index+1}. ${getText(lesson.title)}`;

                if (index === текущийУрок) btn.classList.add('active');
                const allDone = решенныеЗадачи[index].every(v => v === true);

            } else {
                nextBtn.disabled = true;

        function renderTasks(lesson) {
            tasksContainer.innerHTML = '';
            lesson.tasks.forEach((task, idx) => {
                const isBonus = idx > 0;
                const isDone = решенныеЗадачи[текущийУрок][idx];

                const div = document.createElement('div');
                div.className = `task-item ${isBonus ? 'bonus' : ''} ${isDone ? 'completed' : ''}`;

                const header = document.createElement('div');
                header.className = 'task-header';

                const textSpan = document.createElement('span');
                textSpan.className = 'task-text';
                textSpan.innerHTML = getTaskText(task);
                header.appendChild(textSpan);

                const status = document.createElement('span');
                status.className = `task-status ${isDone ? 'done' : ''} ${isBonus ? 'bonus-label' : ''}`;
                status.textContent = isDone ? LANG[getLang()].done : (isBonus ? LANG[getLang()].bonus : LANG[getLang()]
                    .required);
                header.appendChild(status);

                div.appendChild(header);

                const input = document.createElement('textarea');
                input.className = 'task-input';
                input.placeholder = isBonus ? LANG[getLang()].write_code_optional : LANG[getLang()].write_code;
                input.disabled = isDone;
                if (isDone) input.value = task.solution;
                div.appendChild(input);

                const actions = document.createElement('div');
                actions.className = 'task-actions';

                const checkBtn = document.createElement('button');
                checkBtn.className = 'btn-sm primary';
                checkBtn.textContent = LANG[getLang()].check;
                checkBtn.disabled = isDone;
                checkBtn.addEventListener('click', () => {
                    if (isDone) return;
                    const userCode = input.value.trim();
                    if (!userCode) {
                        showTaskResult(div, 'error', LANG[getLang()].write_something);
                        return;
                    }
                    const isCorrect = task.check(userCode);
                    if (isCorrect) {
                        решенныеЗадачи[текущийУрок][idx] = true;
                        const now = Date.now();
                        if (последнееВремяРешения > 0 && (now - последнееВремяРешения) < 120000) {
                            серия++;
                            if (серия >= 3 && !достижения.speedDemon) {
                                достижения.speedDemon = true;
                                unlockAchievement('achSpeedDemon', '🔥 Speed Demon');
                            }
                        } else {
                            серия = 1;
                        }
                        последнееВремяРешения = now;
                        renderLesson();
                        showTaskResult(div, 'success', LANG[getLang()].correct);
                        addAIMessage(`${LANG[getLang()].task_done_ai} ${idx+1}! ${LANG[getLang()].keep_going}`, 'bot');
                    } else {
                        showTaskResult(div, 'error', LANG[getLang()].wrong);
                    }
                });
                actions.appendChild(checkBtn);

                const hintBtn = document.createElement('button');
                hintBtn.className = 'btn-sm ai-hint';
                hintBtn.textContent = LANG[getLang()].ai_hint;
                hintBtn.addEventListener('click', () => {
                    const hint = generateHint(текущийУрок, idx);
                    showTaskResult(div, 'hint', '💡 ' + hint);
                });
                actions.appendChild(hintBtn);

                const resetTaskBtn = document.createElement('button');
                resetTaskBtn.className = 'btn-sm secondary';
                resetTaskBtn.textContent = LANG[getLang()].reset_task;
                resetTaskBtn.addEventListener('click', () => {
                    if (isDone && idx === 0) {
                        showTaskResult(div, 'error', LANG[getLang()].cant_reset);
                        return;
                    }
                    if (isDone) {
                        решенныеЗадачи[текущийУрок][idx] = false;
                        renderLesson();
                        return;
                    }
                    input.value = '';
                    hideTaskResult(div);
                });
                actions.appendChild(resetTaskBtn);

                div.appendChild(actions);

                const result = document.createElement('div');
                result.className = 'task-result';
                div.appendChild(result);

                tasksContainer.appendChild(div);
            });
        }

                `Check if you need <code>:</code> after conditions or loops.`,
                `Python cares about indentation!`,
                `You can do it! Try again.`
            ];
            const hints = getLang() === 'ru' ? hints_ru : hints_en;
            return hints[taskIdx % hints.length];
        }

        function addAIMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `ai-message ${sender}`;
            div.innerHTML = text;
            aiChat.appendChild(div);
            aiChat.scrollTop = aiChat.scrollHeight;
        }

        function handleAIQuery(query) {
            const q = query.toLowerCase().trim();
            addAIMessage(q, 'user');

            if (q.includes('plan') || q.includes('помоги') || q.includes('хочу изучить') || q.includes('help me learn') || q
                .includes('know') || q.includes('знаю')) {
                const plan = generatePlan(q);
                addAIMessage(plan, 'bot');
                return;
            }

            if (q.includes('hint') || q.includes('подсказк') || q.includes('help') || q.includes('помоги')) {
                const lesson = LESSONS_DATA[текущийУрок];
                const firstIncomplete = lesson.tasks.findIndex((t, i) => !решенныеЗадачи[текущийУрок][i]);
                const idx = firstIncomplete !== -1 ? firstIncomplete : 0;
                const hint = generateHint(текущийУрок, idx);
                addAIMessage(`💡 ${getLang() === 'ru' ? 'Для задачи' : 'For task'} ${idx+1}: ${hint}`, 'bot');
                return;
            }

            if (q.includes('explain') || q.includes('объясни') || q.includes('what is') || q.includes('что такое')) {
                const concepts = {
                    'variable': getLang() === 'ru' ?
                        'Переменная хранит данные. Как коробка с ярлыком. Пример: <code>x = 5</code>' :
                        'A variable stores data. Like a box with a label. Example: <code>x = 5</code>',
                    'string': getLang() === 'ru' ?
                        'Строка — это текст в кавычках. Пример: <code>name = "Анна"</code>' :
                        'A string is text in quotes. Example: <code>name = "Anna"</code>',
                    'int': getLang() === 'ru' ?
                        'Целое число (int) — без запятой. Пример: <code>age = 14</code>' :
                        'An integer is a whole number. Example: <code>age = 14</code>',
                    'float': getLang() === 'ru' ?
                        'Число с плавающей точкой (float) — с десятичной частью. Пример: <code>height = 1.65</code>' :
                        'A float is a number with a decimal. Example: <code>height = 1.65</code>',
                    'bool': getLang() === 'ru' ?
                        'Булевое значение — True или False. Пример: <code>is_student = True</code>' :
                        'A boolean is True or False. Example: <code>is_student = True</code>',
                    'if': getLang() === 'ru' ?
                        'Если (if) проверяет условие. Пример: <code>if x > 5: print("да")</code>' :
                        'If checks a condition. Example: <code>if x > 5: print("yes")</code>',
                    'loop': getLang() === 'ru' ?
                        'Цикл повторяет код. Пример: <code>for i in range(3): print(i)</code>' :
                        'A loop repeats code. Example: <code>for i in range(3): print(i)</code>',
                    'function': getLang() === 'ru' ?
                        'Функция — переиспользуемый код. Пример: <code>def hello(): print("hi")</code>' :
                        'A function is reusable code. Example: <code>def hello(): print("hi")</code>',
                    'list': getLang() === 'ru' ?
                        'Список — коллекция элементов. Пример: <code>fruits = ["яблоко", "банан"]</code>' :
                        'A list is a collection. Example: <code>fruits = ["apple", "banana"]</code>',
                    'dict': getLang() === 'ru' ?
                        'Словарь — пары ключ→значение. Пример: <code>person = {"name": "Анна"}</code>' :
                        'A dictionary stores key→value pairs. Example: <code>person = {"name": "Anna"}</code>',
                };
                let response = getLang() === 'ru' ?
                    'Я могу объяснить: переменные, строки, int, float, bool, if, циклы, функции, списки, словари. Что именно?' :
                    'I can explain: variables, strings, int, float, bool, if, loops, functions, lists, dictionaries. Which one?';
                for (const [key, value] of Object.entries(concepts)) {
                    if (q.includes(key)) {
                        response = value;
                        break;
                    }
                }
                addAIMessage(response, 'bot');
                return;
            }

            if (q.includes('fix') || q.includes('исправ') || q.includes('error') || q.includes('ошибк')) {
                addAIMessage(getLang() === 'ru' ?
                    '🔧 Пришли свой код, и я помогу найти ошибки! Частые проблемы: кавычки, двоеточия, отступы.' :
                    '🔧 Paste your code and I\'ll help find errors! Common issues: quotes, colons, indentation.', 'bot');
                return;
            }

            addAIMessage(getLang() === 'ru' ?
                '🤔 Я здесь, чтобы помочь! Спрашивай: подсказки, объяснения, план обучения, или помощь с кодом.' :
                '🤔 I\'m here to help! Ask for: hints, explanations, learning plans, or code help.', 'bot');
        }

        // ================================================================
        //  UI-ПОМОЩНИКИ
        // ================================================================
        function showTaskResult(container, type, message) {
            const result = container.querySelector('.task-result');
            result.className = `task-result show ${type}`;
            result.innerHTML = message;
        }

        function hideTaskResult(container) {
            const result = container.querySelector('.task-result');
            result.className = 'task-result';
            result.innerHTML = '';
        }

        function showMainResult(type, message) {
            mainResult.className = `main-result show ${type}`;
            mainResult.textContent = message;
        }

        function hideMainResult() {
            mainResult.className = 'main-result';
            mainResult.textContent = '';
        }

        function updateProgress() {
            const allTasks = LESSONS_DATA.reduce((acc, l) => acc + l.tasks.length, 0);
            const doneTasks = решенныеЗадачи.reduce((acc, l) => acc + l.filter(v => v).length, 0);
            const percent = (doneTasks / allTasks) * 100;
            progressFill.style.width = percent + '%';
        }

        // ================================================================
        //  НАВИГАЦИЯ
        // ================================================================
        function goToLesson(index) {
            if (index < 0 || index >= LESSONS_DATA.length) return;
            текущийУрок = index;
            hideMainResult();
            renderLesson();
            document.querySelector('.app').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetAll() {
            const msg = getLang() === 'ru' ? 'Сбросить весь прогресс? (все твои достижения исчезнут!)' :
                'Reset all progress? (all your achievements will disappear!)';
            if (confirm(msg)) {
                решенныеЗадачи = LESSONS_DATA.map(l => l.tasks.map(() => false));
                достижения = { firstBlood: false, perfectionist: false, speedDemon: false, scholar: false,
                master: false };
                серия = 0;
                последнееВремяРешения = 0;
                document.querySelectorAll('.achievement').forEach(el => el.classList.remove('unlocked'));
                текущийУрок = 0;
                hideMainResult();
                renderLesson();
                renderNav();
                updateProgress();
                updateAchievements();
                const msg2 = getLang() === 'ru' ? '🔄 Прогресс сброшен. Начинай заново! (я грущу, но это твой выбор)' :
                    '🔄 Progress reset. Start fresh! (I\'m sad, but it\'s your choice)';
                addAIMessage(msg2, 'bot');
            }
        }

        function nextLesson() {
            if (nextBtn.disabled) return;
            const next = текущийУрок + 1;
            if (next >= LESSONS_DATA.length) {
                const msg = getLang() === 'ru' ?
                    '🏆 ПОЗДРАВЛЯЮ! Ты прошел(а) все 10 уроков! Ты настоящий программист! 👑 (я плачу от счастья)' :
                    '🏆 CONGRATULATIONS! You completed all 10 lessons! You\'re a Python Master! 👑 (I\'m crying with joy)';
                showMainResult('success', msg);
                nextBtn.disabled = true;
                addAIMessage('🎉🎉🎉 AMAZING! You completed everything! You\'re a real programmer now! 🚀', 'bot');
                return;
            }
            текущийУрок = next;
            hideMainResult();
            renderLesson();
            const msg = getLang() === 'ru' ?
                `📚 Переходим к уроку ${next+1}: ${getText(LESSONS_DATA[next].title)}. Поехали!` :
                `📚 Moving to Lesson ${next+1}: ${getText(LESSONS_DATA[next].title)}. Let's go!`;
            addAIMessage(msg, 'bot');
            document.querySelector('.app').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ================================================================
        //  БЫСТРЫЕ КНОПКИ AI
        // ================================================================
        document.querySelectorAll('[data-hint]').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.hint;
                const map = {
                    'hint': getLang() === 'ru' ? 'Дай подсказку к этой задаче' : 'Give me a hint for this task',
                    'explain': getLang() === 'ru' ? 'Объясни, что мне нужно сделать' : 'Explain what I need to do',
                    'plan': getLang() === 'ru' ? 'Помоги изучить Python, я знаю переменные' :
                        'Help me learn Python, I know variables',
                    'fix': getLang() === 'ru' ? 'Мой код с ошибкой, помоги исправить' : 'My code has an error, help me fix it'
                };
                const msg = map[type] || '';
                aiInput.value = msg;
                handleAIQuery(msg);
                aiInput.value = '';
            });
        });

        // ================================================================
        //  ОТПРАВКА СООБЩЕНИЯ В AI
        // ================================================================
        aiSendBtn.addEventListener('click', () => {
            const q = aiInput.value.trim();
            if (!q) return;
            handleAIQuery(q);
            aiInput.value = '';
        });

        aiInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                aiSendBtn.click();
            }
        });

        // ================================================================
        //  ГОРЯЧИЕ КЛАВИШИ
        // ================================================================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'R') {
                e.preventDefault();
                resetAll();
            }
        });

        // ================================================================
        //  ЗАПУСК
        // ================================================================
        function init() {
            const browserLang = navigator.language || 'en';
            const defaultLang = browserLang.startsWith('ru') ? 'ru' : 'en';
            setLanguage(defaultLang);
            renderNav();
            renderLesson();
            updateProgress();ф
            updateAchievements();
            const welcome = getLang() === 'ru' ?
                '👋 Привет! Я твой AI-помощник. Спрашивай подсказки, объяснения или скажи, что хочешь изучить — я составлю план!' :
                '👋 Hi! I\'m your AI tutor. Ask me for hints, explain concepts, or tell me what you want to learn and I\'ll build a plan for you!';
            addAIMessage(welcome, 'bot');
            console.log('🐍 PyLearner AI loaded!');
            console.log('💡 Shortcut: Ctrl+Shift+R to reset');
            console.log('🤖 AI Tutor ready with advanced planning!');
            console.log('❤️ Made by Anna with lots of coffee and debugging');
        }

        init();
    </script>
</body>
</html>
