<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>PyForge — 代码熔炉</title>
    <style>
        /* ============================================================
           СТИЛИ — Я ИХ ПЕРЕПИСЫВАЛА 3 РАЗА, ПОКА НЕ ПОНРАВИЛОСЬ
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 1rem;
        }
        .app {
            max-width: 1000px;
            margin: 0 auto;
            background: #1e293b;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .header-left h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .lang-switch {
            display: flex;
            gap: 0.2rem;
            background: #0f172a;
            border-radius: 30px;
            padding: 0.15rem;
            border: 1px solid #334155;
        }
        .lang-switch button {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-switch button.active {
            background: #3b82f6;
            color: white;
        }
        .lang-switch button:hover:not(.active) {
            color: white;
        }
        .badge {
            background: #334155;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .badge span {
            color: #60a5fa;
            font-weight: 700;
        }
        .badge-premium {
            background: #7c3aed;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        .badge-premium.unlocked {
            background: #22c55e;
        }
        .achievements-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            background: #0f172a;
            padding: 0.5rem 1rem;
            border-radius: 16px;
            margin-bottom: 1rem;
            align-items: center;
        }
        .achievements-bar .label {
            color: #94a3b8;
            font-size: 0.75rem;
            margin-right: 0.3rem;
        }
        .achievement {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            background: #1e293b;
            padding: 0.15rem 0.6rem 0.15rem 0.3rem;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #94a3b8;
            border: 1px solid #334155;
            transition: 0.3s;
        }
        .achievement.unlocked {
            border-color: #fbbf24;
            color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.12);
        }
        .premium-banner {
            background: linear-gradient(135deg, #2e1065, #7c3aed);
            border-radius: 16px;
            padding: 0.8rem 1.2rem;
            margin-bottom: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            border: 1px solid #a78bfa;
        }
        .premium-banner .info {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .premium-banner .info .icon {
            font-size: 1.5rem;
        }
        .premium-banner .info .text {
            font-size: 0.85rem;
            color: #e2e8f0;
        }
        .premium-banner .info .text strong {
            color: #fbbf24;
        }
        .premium-banner .info .text .features {
            font-size: 0.75rem;
            color: #cbd5e1;
            margin-top: 0.2rem;
        }
        .premium-banner .actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .btn-premium {
            background: #fbbf24;
            color: #0f172a;
            padding: 0.4rem 1.2rem;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-premium:hover {
            transform: scale(1.05);
            background: #fcd34d;
        }
        .btn-premium.unlocked {
            background: #22c55e;
            color: white;
            cursor: default;
        }
        .btn-premium.unlocked:hover {
            transform: none;
        }
        .btn-boosty {
            background: #334155;
            color: #e2e8f0;
            padding: 0.4rem 1.2rem;
            border: 1px solid #64748b;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-boosty:hover {
            background: #475569;
            border-color: #94a3b8;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 1.5rem;
        }
        @media (max-width: 800px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .lesson-nav {
            display: flex;
            gap: 0.3rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            scrollbar-width: thin;
        }
        .lesson-nav button {
            background: #334155;
            border: none;
            color: #94a3b8;
            padding: 0.25rem 0.6rem;
            border-radius: 8px;
            font-size: 0.7rem;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            font-weight: 500;
            flex-shrink: 0;
            position: relative;
        }
        .lesson-nav button.active {
            background: #3b82f6;
            color: white;
        }
        .lesson-nav button.done {
            border: 2px solid #22c55e;
        }
        .lesson-nav button.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .lesson-nav button.locked::after {
            content: ' 🔒';
            font-size: 0.5rem;
        }
        .lesson-nav button:hover:not(.active):not(.locked) {
            background: #475569;
            color: white;
        }
        .lesson-content {
            background: #0f172a;
            border-radius: 16px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
        }
        .lesson-content h2 {
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
            color: #f1f5f9;
        }
        .lesson-content .theory {
            color: #cbd5e1;
            line-height: 1.8;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
            white-space: pre-wrap;
        }
        .lesson-content .example {
            background: #1e293b;
            border-left: 4px solid #3b82f6;
            padding: 0.6rem 1rem;
            border-radius: 0 8px 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 0.8rem;
            color: #e2e8f0;
        }
        .lesson-content .lock-overlay {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            margin: 1rem 0;
            border: 2px dashed #7c3aed;
        }
        .lesson-content .lock-overlay .lock-icon {
            font-size: 2.5rem;
        }
        .lesson-content .lock-overlay p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }
        .tasks-section {
            margin-top: 1rem;
        }
        .task-item {
            background: #1e293b;
            border-radius: 10px;
            padding: 0.5rem 0.7rem;
            margin-bottom: 0.4rem;
            border-left: 3px solid #334155;
            transition: 0.2s;
        }
        .task-item.bonus {
            border-left-color: #8b5cf6;
            opacity: 0.85;
        }
        .task-item.completed {
            border-left-color: #22c55e;
            background: #0f2a1a;
        }
        .task-item .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .task-item .task-text {
            font-size: 0.8rem;
            color: #e2e8f0;
            flex: 1;
        }
        .task-item .task-status {
            font-size: 0.6rem;
            padding: 0.1rem 0.4rem;
            border-radius: 10px;
            background: #334155;
            color: #94a3b8;
            white-space: nowrap;
        }
        .task-item .task-status.done {
            background: #064e3b;
            color: #86efac;
        }
        .task-item .task-status.bonus-label {
            background: #2e1065;
            color: #a78bfa;
        }
        .task-item .task-actions {
            display: flex;
            gap: 0.25rem;
            margin-top: 0.25rem;
            flex-wrap: wrap;
        }
        .task-item .task-actions .btn-sm {
            padding: 0.12rem 0.5rem;
            border: none;
            border-radius: 6px;
            font-size: 0.6rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-sm.primary {
            background: #3b82f6;
            color: white;
        }
        .btn-sm.primary:hover {
            background: #2563eb;
        }
        .btn-sm.secondary {
            background: #334155;
            color: #94a3b8;
        }
        .btn-sm.secondary:hover {
            background: #475569;
            color: white;
        }
        .btn-sm.ai-hint {
            background: #7c3aed;
            color: white;
        }
        .btn-sm.ai-hint:hover {
            background: #6d28d9;
        }
        .task-item .task-input {
            width: 100%;
            min-height: 38px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #e2e8f0;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            padding: 0.3rem;
            resize: vertical;
            outline: none;
            transition: border 0.2s;
            margin-top: 0.2rem;
        }
        .task-item .task-input:focus {
            border-color: #3b82f6;
        }
        .task-item .task-input:disabled {
            opacity: 0.6;
        }
        .task-item .task-result {
            margin-top: 0.25rem;
            font-size: 0.7rem;
            padding: 0.2rem 0.5rem;
            border-radius: 5px;
            display: none;
        }
        .task-item .task-result.show {
            display: block;
        }
        .task-item .task-result.success {
            background: #064e3b;
            color: #86efac;
            border: 1px solid #22c55e;
        }
        .task-item .task-result.error {
            background: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #ef4444;
        }
        .task-item .task-result.hint {
            background: #1e1b4b;
            color: #a78bfa;
            border: 1px solid #7c3aed;
        }
        .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 0.6rem 0;
        }
        .btn {
            padding: 0.4rem 1rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-secondary {
            background: #334155;
            color: #94a3b8;
        }
        .btn-secondary:hover {
            background: #475569;
            color: white;
        }
        .btn-success {
            background: #22c55e;
            color: white;
        }
        .btn-success:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .progress-bar-wrap {
            background: #334155;
            border-radius: 20px;
            height: 5px;
            overflow: hidden;
            margin-top: 0.6rem;
        }
        .progress-bar-wrap .fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #a78bfa);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 20px;
        }
        .main-result {
            padding: 0.4rem 0.7rem;
            border-radius: 8px;
            margin: 0.2rem 0 0;
            font-size: 0.8rem;
            display: none;
        }
        .main-result.success {
            display: block;
            background: #064e3b;
            border: 1px solid #22c55e;
            color: #86efac;
        }
        .main-result.show {
            display: block;
        }
        .ai-sidebar {
            background: #0f172a;
            border-radius: 16px;
            padding: 0.8rem;
            height: fit-content;
            position: sticky;
            top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .ai-sidebar h3 {
            font-size: 0.9rem;
            color: #a78bfa;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .ai-chat {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 350px;
            overflow-y: auto;
        }
        .ai-message {
            padding: 0.4rem 0.6rem;
            border-radius: 10px;
            font-size: 0.8rem;
            line-height: 1.5;
            max-width: 95%;
            white-space: pre-wrap;
        }
        .ai-message.bot {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }
        .ai-message.user {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }
        .ai-input-row {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.2rem;
        }
        .ai-input-row input {
            flex: 1;
            padding: 0.4rem 0.6rem;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-size: 0.8rem;
            outline: none;
        }
        .ai-input-row input:focus {
            border-color: #7c3aed;
        }
        .ai-input-row input::placeholder {
            color: #64748b;
        }
        .ai-input-row button {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .ai-input-row button:hover {
            background: #6d28d9;
        }
        .ai-quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.25rem;
            margin-top: 0.1rem;
        }
        .ai-quick-actions button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.15rem 0.5rem;
            border-radius: 30px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .ai-quick-actions button:hover {
            background: #334155;
            color: white;
            border-color: #7c3aed;
        }
        .save-notice {
            background: #1e293b;
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            font-size: 0.7rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 0.3rem;
            border: 1px solid #334155;
        }
        @media (max-width: 600px) {
            .app {
                padding: 0.8rem;
            }
            .header-left h1 {
                font-size: 1.1rem;
            }
            .lesson-content {
                padding: 0.8rem;
            }
            .task-item {
                padding: 0.4rem;
            }
            .btn {
                padding: 0.3rem 0.7rem;
                font-size: 0.7rem;
            }
            .ai-sidebar {
                position: static;
            }
            .main-grid {
                gap: 0.8rem;
            }
            .ai-chat {
                max-height: 200px;
            }
            .premium-banner {
                flex-direction: column;
                text-align: center;
            }
            .premium-banner .actions {
                justify-content: center;
            }
            .lesson-nav button {
                font-size: 0.6rem;
                padding: 0.2rem 0.4rem;
            }
            .lang-switch button {
                font-size: 0.6rem;
                padding: 0.1rem 0.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="app" id="app">
        <!-- ШАПКА -->
        <div class="header">
            <div class="header-left">
                <h1>⚔️ PyForge</h1>
            </div>
            <div class="header-right">
                <div class="lang-switch" id="langSwitch">
                    <button data-lang="ru" class="active">🇷🇺 RU</button>
                    <button data-lang="en">🇬🇧 EN</button>
                    <button data-lang="zh">🇨🇳 中文</button>
                </div>
                <div class="badge" id="premiumBadge">⭐ Free</div>
                <div class="badge">🎯 XP: <span id="xpDisplay">0</span></div>
                <div class="badge">📚 <span id="currentLessonNum">1</span>/<span id="totalLessons">28</span></div>
            </div>
        </div>

        <!-- ДОСТИЖЕНИЯ -->
        <div class="achievements-bar" id="achievementsBar">
            <span class="label" data-i18n="achievements">🏆 成就</span>
            <div class="achievement" id="achFirstBlood"><span class="icon">⚡</span> First Blood</div>
            <div class="achievement" id="achPerfectionist"><span class="icon">💎</span> Perfectionist</div>
            <div class="achievement" id="achSpeedDemon"><span class="icon">🔥</span> Speed Demon</div>
            <div class="achievement" id="achScholar"><span class="icon">📖</span> Scholar</div>
            <div class="achievement" id="achMaster"><span class="icon">👑</span> Master</div>
            <div class="achievement" id="achSupporter"><span class="icon">💜</span> Supporter</div>
        </div>

        <!-- PREMIUM-БАННЕР -->
        <div class="premium-banner" id="premiumBanner">
            <div class="info">
                <span class="icon">⭐</span>
                <div class="text">
                    <div><strong data-i18n="premium_title">⭐ 高级访问</strong></div>
                    <div class="features" data-i18n="premium_features">
                        🔓 8 节独家课程 · 🤖 高级 AI · 📜 证书
                    </div>
                </div>
            </div>
            <div class="actions">
                <a href="#" class="btn-boosty" id="boostyBtn" target="_blank">❤️ 在 Boosty 上支持</a>
                <button class="btn-premium" id="unlockPremiumBtn" data-i18n="premium_btn">⭐ 解锁高级版</button>
            </div>
        </div>

        <!-- ОСНОВНАЯ СЕТКА -->
        <div class="main-grid">
            <div>
                <div class="lesson-nav" id="lessonNav"></div>
                <div class="lesson-content" id="lessonContent">
                    <h2 id="lessonTitle">变量</h2>
                    <div class="theory" id="lessonTheory"></div>
                    <div class="example" id="lessonExample"></div>
                    <div id="lockOverlay" style="display:none;"></div>
                    <div class="tasks-section" id="tasksContainer"></div>
                </div>
                <div class="main-result" id="mainResult"></div>
                <div class="actions">
                    <button class="btn btn-secondary" id="resetBtn" data-i18n="reset">↺ 重置全部</button>
                    <button class="btn btn-success" id="nextBtn" disabled data-i18n="next">→ 下一课</button>
                </div>
                <div class="progress-bar-wrap">
                    <div class="fill" id="progressFill"></div>
                </div>
                <div class="save-notice" id="saveNotice">💾 进度自动保存</div>
            </div>

            <!-- AI САЙДБАР -->
            <div class="ai-sidebar">
                <h3><span>🤖</span> <span data-i18n="ai_tutor">AI 助手</span></h3>
                <div class="ai-chat" id="aiChat">
                    <div class="ai-message bot" data-i18n="ai_welcome">
                        👋 你好！我是你的 AI 助手。问我提示、解释，或者告诉我你想学什么！
                    </div>
                </div>
                <div class="ai-quick-actions">
                    <button data-hint="hint" data-i18n="hint">💡 提示</button>
                    <button data-hint="explain" data-i18n="explain">📖 解释</button>
                    <button data-hint="plan" data-i18n="plan">📋 计划</button>
                    <button data-hint="fix" data-i18n="fix">🔧 修复</button>
                </div>
                <div class="ai-input-row">
                    <input type="text" id="aiInput" data-i18n-placeholder="ask_ai" placeholder="问 AI 任何问题..." />
                    <button id="aiSendBtn" data-i18n="send">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  ПЕРЕВОДЫ — ТЕПЕРЬ НА ТРЁХ ЯЗЫКАХ!
        //  Я СОНЯ, И Я СДЕЛАЛА ЭТОТ ПЕРЕВОД С ПОМОЩЬЮ ДРУЗЕЙ И ГУГЛА
        // ================================================================
        const LANG = {
            ru: {
                achievements: '🏆 Достижения:',
                reset: '↺ Сбросить всё',
                next: '→ Следующий урок',
                ai_tutor: 'AI-помощник',

            🎯 В этом уроке ты научишься использовать циклы for.`,
                    en: `Loops are used to repeat the same action several times. It's like saying: "Do this 3 times!"

            • range(2, 10, 2) → numbers 2, 4, 6, 8 (step 2)

            🔥 Loops are very useful when you need to do something many times!

            🎯 In this lesson, you'll learn to use for loops.`,
                    zh: `循环用于重复执行同一动作多次。就像你在说："做这个 3 次！"

            🔥 当你需要做很多事情时，循环非常有用！

            🎯 在本课中，你将学习使用 for 循环。`

                theory: {
                    ru: `Функции — это как маленькие программы внутри программы. Ты можешь написать код один раз, а потом вызывать его сколько угодно раз.

                    en: `Functions are like little programs inside your program. You can write code once and then call it as many times as you want.

                    zh: `函数就像程序中的小程序。你可以写一次代码，然后随意调用多少次。

                theory: {
                    ru: `Списки — это коллекции элементов. Они хранят несколько значений в одной переменной.

                    en: `Lists are collections of elements. They store multiple values in one variable.

            📌 Written like this: list = [element1, element2, element3]

            💡 List elements can be of different types (numbers, text, even other lists!).

                    zh: `列表是元素的集合。它们在一个变量中存储多个值。

                theory: {
                    ru: `Словари хранят пары "ключ → значение". Это как телефонная книга: ты ищешь по имени (ключ) и получаешь номер телефона (значение).

                    en: `Dictionaries store key → value pairs. It's like a phone book: you search by name (key) and get a phone number (value).

            // ---- УРОК 7: ЦИКЛЫ while ----
            {
                id: 7,
                title: { ru: 'Циклы while', en: 'While Loops', zh: 'While 循环' },
                theory: {
                    ru: `Цикл while повторяется, пока условие истинно. Он не знает, сколько раз нужно повторить — он просто проверяет: "Всё ещё правда? Тогда делай ещё раз!"

            📌 Записывается так:
            while условие:
                действие

            🔥 Важно: убедись, что условие когда-нибудь станет ложным, иначе цикл будет крутиться вечно!

            💡 while полезен, когда ты не знаешь заранее, сколько раз нужно повторить.

            🎯 В этом уроке ты научишься использовать циклы while.`,
                    en: `The while loop repeats while the condition is true. It doesn't know how many times to repeat — it just checks: "Still true? Then do it again!"

            📌 Written like this:
            while condition:
                action

            🔥 Important: make sure the condition becomes false eventually, otherwise the loop will run forever!

            💡 while is useful when you don't know in advance how many times to repeat.

            🎯 In this lesson, you'll learn to use while loops.`,
                    zh: `while 循环在条件为真时重复执行。它不知道要重复多少次——它只是检查："仍然为真？那就再做一次！"

            📌 写法：
            while 条件:
                动作

            🔥 重要：确保条件最终会变为假，否则循环将永远运行！

            💡 当你不知道需要重复多少次时，while 很有用。

            🎯 在本课中，你将学习使用 while 循环。`
                },

                print(i)

                i = i + 1  # increment i by 1`,

                            check: c => c.replace(/\s/g, '').includes('whilei<5:') && c.replace(/\s/g, '').includes(
                                'i=i+1') },

            // ---- УРОК 10: МНОЖЕСТВА (set) ----
            {

                theory: {
                    ru: `Множество — это как список, но без повторяющихся элементов. Если ты добавишь одно и то же значение несколько раз, оно сохранится только один раз.

            📌 Создаётся множество так: множество = {элемент1, элемент2, элемент3}

            📌 Основные операции:
            • union (объединение) — все элементы из двух множеств: a | b
            • intersection (пересечение) — элементы, которые есть в обоих: a & b
            • difference (разность) — элементы из первого, которых нет во втором: a - b

            🎯 В этом уроке ты научишься работать с множествами.`,
                    en: `A set is like a list, but without duplicates. If you add the same value multiple times, it's stored only once.

            📌 Created like this: set = {element1, element2, element3}

            📌 Main operations:
            • union — all elements from both sets: a | b
            • intersection — elements in both sets: a & b
            • difference — elements in first but not in second: a - b

            🎯 In this lesson, you'll learn to work with sets.`,
                    zh: `集合就像列表，但没有重复元素。如果你多次添加相同的值，它只会存储一次。

            📌 主要操作：
            • union（并集）— 两个集合中的所有元素：a | b
            • intersection（交集）— 两个集合中都有的元素：a & b
            • difference（差集）— 在第一个集合中但不在第二个集合中的元素：a - b

            🎯 在本课中，你将学习使用集合。`

            {
                id: 12,
                title: { ru: 'Работа с файлами', en: 'File Handling', zh: '文件操作' },
                theory: {
                    ru: `Иногда нужно сохранить данные на компьютер, чтобы они не исчезли после закрытия программы. Для этого мы работаем с файлами.

            📌 Как открыть файл:
            file = open("file.txt", "r")  # "r" — чтение
            file = open("file.txt", "w")  # "w" — запись (перезаписывает)
            file = open("file.txt", "a")  # "a" — добавление в конец

            📌 Как прочитать файл:
            file = open("file.txt", "r")
            content = file.read()
            print(content)
            file.close()  # важно закрыть файл!

            💡 Удобный способ (с автоматическим закрытием):
            with open("file.txt", "r") as file:
                content = file.read()
                print(content)

            🎯 В этом уроке ты научишься читать и записывать файлы.`,
                    en: `Sometimes you need to save data to your computer so it doesn't disappear after closing the program. This is why we work with files.

            📌 How to open a file:
            file = open("file.txt", "r")  # "r" — read
            file = open("file.txt", "w")  # "w" — write (overwrites)
            file = open("file.txt", "a")  # "a" — append

            📌 How to read a file:
            file = open("file.txt", "r")
            content = file.read()
            print(content)
            file.close()  # important to close the file!

            💡 Convenient way (auto-closing):
            with open("file.txt", "r") as file:
                content = file.read()
                print(content)

            🎯 In this lesson, you'll learn to read and write files.`,
                    zh: `有时你需要将数据保存到计算机上，这样在关闭程序后数据不会消失。这就是我们处理文件的原因。

            📌 如何打开文件：
            file = open("file.txt", "r")  # "r" — 读取
            file = open("file.txt", "w")  # "w" — 写入（覆盖）
            file = open("file.txt", "a")  # "a" — 追加

            📌 如何读取文件：
            file = open("file.txt", "r")
            content = file.read()
            print(content)
            file.close()  # 记得关闭文件！

            💡 更方便的方式（自动关闭）：
            with open("file.txt", "r") as file:
                content = file.read()
                print(content)

            🎯 在本课中，你将学习读取和写入文件。`
                },

                    ru: `# Пример записи в файл
            with open("hello.txt", "w") as file:
                file.write("Привет, мир!")`,
                    en: `# Example of writing to a file

            📌 Как использовать:
            import re
            text = "Мой email: anna@example.com"
            pattern = r"\w+@\w+\.\w+"
            result = re.search(pattern, text)
            print(result.group())  # anna@example.com

            📌 Простые шаблоны:
            • \d — любая цифра
            • \w — любая буква или цифра
            • \s — пробел
            • + — один или более раз

            🎯 В этом уроке ты научишься искать текст по шаблону.`,
                    en: `Regular expressions are a way to search text by pattern. For example, find all email addresses or phone numbers.

            text = "My email: anna@example.com"
            pattern = r"\w+@\w+\.\w+"
            result = re.search(pattern, text)
            print(result.group())  # anna@example.com

            {

                theory: {
                    ru: `Бинарный поиск — это способ найти число в отсортированном списке очень-очень быстро. Представь, что ты ищешь слово в толстом словаре. Ты же не читаешь каждую страницу подряд? Ты открываешь книгу примерно посередине, смотришь, где твоё слово, и отбрасываешь половину страниц. Так же работает и бинарный поиск!

            📌 Как это работает:
            1. Берёшь отсортированный список (например, [1, 3, 5, 7, 9, 11, 13]).
            2. Смотришь на элемент в середине.
            3. Если он равен тому, что ищешь — готово!
            4. Если он больше искомого — отбрасываешь правую половину.
            5. Если он меньше искомого — отбрасываешь левую половину.
            6. Повторяешь, пока не найдёшь.

            📌 Скорость: O(log N). Что это значит?
            Если в списке 1 000 000 элементов, бинарный поиск найдёт нужный за 20 шагов! А обычный (линейный) поиск — за 1 000 000 шагов.

            💡 Где применяется: поиск в базах данных, в играх (поиск по рейтингу), в любых отсортированных данных.

            🎯 В этом уроке ты научишься писать бинарный поиск на Python.`,
                    en: `Binary search is a way to find a number in a sorted list very, very quickly. Imagine you're looking for a word in a thick dictionary. You don't read every page, right? You open the book roughly in the middle, see where your word is, and throw away half the pages. Binary search works the same way!

            📌 How it works:
            1. Take a sorted list (e.g., [1, 3, 5, 7, 9, 11, 13]).
            2. Look at the element in the middle.
            3. If it's the one you're looking for — done!
            4. If it's larger than what you're looking for — discard the right half.
            5. If it's smaller — discard the left half.
            6. Repeat until you find it.

            📌 Speed: O(log N). What does that mean?
            If the list has 1,000,000 elements, binary search will find what you need in 20 steps! Regular (linear) search would take 1,000,000 steps.

            💡 Where it's used: searching in databases, in games (rating search), in any sorted data.

            🎯 In this lesson, you'll learn to write binary search in Python.`,
                    zh: `二分搜索是一种在排序列表中极快查找数字的方法。想象你在厚厚的字典中查找一个单词。你不是一页一页地读，对吧？你大致打开书的中间，看看你的词在哪里，然后扔掉一半的页面。二分搜索也是同样的原理！

            📌 工作原理：
            1. 取一个排序列表（例如 [1, 3, 5, 7, 9, 11, 13]）。
            2. 查看中间的元素。
            3. 如果它就是你找的——完成！
            4. 如果它比目标大——丢弃右半部分。
            5. 如果它比目标小——丢弃左半部分。
            6. 重复直到找到。

            📌 速度：O(log N)。这意味着什么？
            如果列表有 1,000,000 个元素，二分搜索只需要 20 步就能找到！而普通（线性）搜索需要 1,000,000 步。

            💡 应用场景：数据库搜索、游戏（排位搜索）、任何排序数据。

            🎯 在本课中，你将学习用 Python 编写二分搜索。`
                },
                example: {
                    ru: `# Бинарный поиск
            def binary_search(arr, target):
                left, right = 0, len(arr) - 1
                while left <= right:
                    mid = (left + right) // 2
                    if arr[mid] == target:
                        return mid
                    elif arr[mid] < target:
                        left = mid + 1
                    else:
                        right = mid - 1

            {
                id: 21,
                title: { ru: 'Сортировка слиянием', en: 'Merge Sort', zh: '归并排序' },
                theory: {
                    ru: `Сортировка слиянием — это один из самых эффективных способов упорядочить список. Он работает по принципу "разделяй и властвуй": разбивает большую задачу на маленькие, решает их и соединяет результаты.

            📌 Как работает:
            1. Делит список пополам.
            2. Сортирует каждую половину отдельно (рекурсивно).
            3. Сливает две отсортированные половины в одну.

            📌 Пример: [38, 27, 43, 3, 9, 82, 10]
            → [38, 27, 43] и [3, 9, 82, 10]
            → [38] [27, 43] [3, 9] [82, 10]
            → сортировка и слияние: [3, 9, 10, 27, 38, 43, 82]

            📌 Скорость: O(N log N) — это очень быстро! Даже для миллионов элементов.

            💡 Где применяется: во всех языках программирования есть встроенная сортировка, но понимать, как она работает внутри — это признак настоящего инженера.

            🎯 В этом уроке ты напишешь свою собственную сортировку слиянием!`,
                    en: `Merge sort is one of the most efficient ways to sort a list. It works on the "divide and conquer" principle: break a big problem into small ones, solve them, and combine the results.

            📌 How it works:
            1. Divides the list in half.
            2. Sorts each half separately (recursively).
            3. Merges the two sorted halves into one.

            📌 Example: [38, 27, 43, 3, 9, 82, 10]
            → [38, 27, 43] and [3, 9, 82, 10]
            → [38] [27, 43] [3, 9] [82, 10]
            → sorting and merging: [3, 9, 10, 27, 38, 43, 82]

            📌 Speed: O(N log N) — very fast! Even for millions of elements.

            💡 Where it's used: every programming language has built-in sorting, but understanding how it works inside — that's the mark of a real engineer.

            🎯 In this lesson, you'll write your own merge sort!`,
                    zh: `归并排序是最有效的排序方法之一。它遵循"分而治之"原则：将大问题分解为小问题，解决它们，然后合并结果。

            📌 工作原理：
            1. 将列表分成两半。
            2. 分别对每一半进行排序（递归）。
            3. 将两个排序好的半部分合并成一个。

            📌 示例：[38, 27, 43, 3, 9, 82, 10]
            → [38, 27, 43] 和 [3, 9, 82, 10]
            → [38] [27, 43] [3, 9] [82, 10]
            → 排序和合并：[3, 9, 10, 27, 38, 43, 82]

            📌 速度：O(N log N) — 非常快！即使对百万级元素也很快。

            💡 应用场景：每种编程语言都有内置排序，但理解其内部工作原理——是真正工程师的标志。

            🎯 在本课中，你将编写你自己的归并排序！`
                },
                example: {
                    ru: `# Сортировка слиянием
            def merge_sort(arr):
                if len(arr) <= 1:
                    return arr
                mid = len(arr) // 2

                return merge(left, right)`,

            // ---- УРОК 22: ДИНАМИЧЕСКОЕ ПРОГРАММИРОВАНИЕ ----
            {
                id: 22,
                title: { ru: 'Динамическое программирование', en: 'Dynamic Programming', zh: '动态规划' },
                theory: {
                    ru: `Динамическое программирование (ДП) — это метод, который помогает решать сложные задачи, разбивая их на простые подзадачи и запоминая результаты. Это как если бы ты решала головоломку: сначала собираешь углы, потом края, а затем середину — и запоминаешь, как ты это сделала.

            📌 Классический пример: числа Фибоначчи.
            F(0) = 0, F(1) = 1, F(2) = 1, F(3) = 2, F(4) = 3...
            Каждое число — это сумма двух предыдущих.

            ❌ Без ДП (рекурсия) — очень медленно, потому что считает одно и то же много раз.
            ✅ С ДП (запоминаем результаты) — быстро!

            📌 Как работает ДП на примере чисел Фибоначчи:
            dp[0] = 0, dp[1] = 1
            for i = 2 to n:
                dp[i] = dp[i-1] + dp[i-2]

            📌 Скорость: O(N) — линейная, даже для больших чисел.

            💡 Где применяется: поиск кратчайшего пути, задача о рюкзаке, расчёт выигрышных стратегий в играх.

            🎯 В этом уроке ты научишься решать задачи с помощью ДП!`,
                    en: `Dynamic Programming (DP) is a method that helps solve complex problems by breaking them into simple subproblems and storing their results. It's like solving a puzzle: first you solve the corners, then the edges, then the middle — and you remember how you did it.

            📌 Classic example: Fibonacci numbers.
            F(0) = 0, F(1) = 1, F(2) = 1, F(3) = 2, F(4) = 3...
            Each number is the sum of the two previous ones.

            ❌ Without DP (recursion) — very slow, because it calculates the same thing many times.
            ✅ With DP (remembering results) — fast!

            📌 How DP works on Fibonacci:
            dp[0] = 0, dp[1] = 1
            for i = 2 to n:
                dp[i] = dp[i-1] + dp[i-2]

            📌 Speed: O(N) — linear, even for large numbers.

            💡 Where it's used: shortest path finding, knapsack problem, calculating winning strategies in games.

            🎯 In this lesson, you'll learn to solve problems using DP!`,
                    zh: `动态规划（DP）是一种通过将复杂问题分解为简单子问题并存储结果来解决问题的方法。就像解拼图：先拼角，再拼边，然后拼中间——并记住你是怎么拼的。

            📌 经典示例：斐波那契数列。
            F(0) = 0, F(1) = 1, F(2) = 1, F(3) = 2, F(4) = 3...
            每个数字是前两个数字之和。

            ❌ 不用 DP（递归）— 非常慢，因为重复计算相同内容。
            ✅ 使用 DP（记住结果）— 快速！

            📌 DP 在斐波那契数列上的工作方式：
            dp[0] = 0, dp[1] = 1
            for i = 2 to n:
                dp[i] = dp[i-1] + dp[i-2]

            📌 速度：O(N) — 线性，即使用于大数字。

            💡 应用场景：最短路径查找、背包问题、游戏中的胜算策略计算。

            🎯 在本课中，你将学习使用 DP 解决问题！`

                theory: {
                    ru: `ООП (Объектно-ориентированное программирование) — это способ организации кода, при котором программа строится из объектов. Объект — это как сущность из реального мира: например, "студент", "машина" или "книга".

            📌 Класс — это шаблон, по которому создаются объекты.
            Представь, что класс — это чертёж дома, а объект — это сам дом.

            📌 Как создать класс:
            class Student:
                def __init__(self, name, age):
                    self.name = name   # атрибут (свойство) объекта

            student1 = Student("Анна", 14)

            📌 Как использовать атрибуты объекта:
            print(student1.name)   # Анна
            print(student1.age)    # 14

            📌 Методы — это функции внутри класса:

                print(f"Я {self.name}, мне {self.age} лет")

            💡 ООП помогает писать код, который легко понимать, изменять и расширять.

            🎯 В этом уроке ты научишься создавать свои классы и объекты!`,
                    en: `OOP (Object-Oriented Programming) is a way of organizing code where a program is built from objects. An object is like an entity from the real world: for example, a "student", a "car", or a "book".

            📌 A class is a template for creating objects.
            Imagine a class is like a house blueprint, and an object is the actual house.

            📌 How to create a class:
            class Student:
                def __init__(self, name, age):
                    self.name = name   # attribute (property) of the object
                    self.age = age

            📌 How to create an object (instance of a class):
            student1 = Student("Anna", 14)

            📌 How to use object attributes:
            print(student1.name)   # Anna
            print(student1.age)    # 14

            📌 Methods are functions inside a class:
            def introduce(self):

            💡 OOP helps write code that is easy to understand, change, and expand.

            // ---- УРОК 26: НАСЛЕДОВАНИЕ ----
            {
                id: 26,
                title: { ru: 'ООП: Наследование', en: 'OOP: Inheritance', zh: 'OOP: 继承' },
                theory: {
                    ru: `Наследование — это когда новый класс создаётся на основе уже существующего. Новый класс "наследует" все свойства и методы родителя и может добавить свои.

            📌 Представь: у тебя есть класс "Животное" (Animal) — у него есть имя и возраст. А ты хочешь создать класс "Кошка" (Cat) — она тоже имеет имя и возраст, но ещё умеет мяукать. Вместо того чтобы писать всё заново, ты создаёшь класс "Кошка" на основе класса "Животное".

            📌 Синтаксис:
            class Animal:
                def __init__(self, name):
                    self.name = name

            class Cat(Animal):   # Cat наследует от Animal
                def __init__(self, name, color):
                    super().__init__(name)   # вызываем конструктор родителя
                    self.color = color       # добавляем новый атрибут

            📌 super() — специальная функция, которая вызывает конструктор родительского класса.

            💡 Наследование помогает не повторять один и тот же код и строить сложные системы из простых частей.

            🎯 В этом уроке ты научишься создавать иерархии классов!`,
                    en: `Inheritance is when a new class is created based on an existing one. The new class "inherits" all properties and methods of the parent and can add its own.

            📌 Imagine: you have a class "Animal" — it has a name and age. You want to create a class "Cat" — it also has a name and age, but it can also meow. Instead of writing everything again, you create "Cat" based on "Animal".

            📌 Syntax:
            class Animal:
                def __init__(self, name):
                    self.name = name

            class Cat(Animal):   # Cat inherits from Animal
                def __init__(self, name, color):
                    super().__init__(name)   # call the parent constructor
                    self.color = color       # add a new attribute

            📌 super() — a special function that calls the parent class constructor.

                    zh: `继承是指基于现有类创建新类。新类"继承"父类的所有属性和方法，并可以添加自己的属性和方法。

            📌 想象：你有一个"动物"类——它有名字和年龄。你想创建一个"猫"类——它也有名字和年龄，但它还能喵喵叫。与其重新写所有代码，你基于"动物"类创建"猫"类。

                theory: {
                    ru: `Граф — это множество точек (вершин) и линий (рёбер) между ними. Представь карту метро: станции — это вершины, а линии между ними — это рёбра.

            📌 Основные понятия:
            • Вершина (vertex) — точка в графе (например, станция метро).
            • Ребро (edge) — соединение между вершинами (линия метро).
            • Путь (path) — последовательность вершин, соединённых рёбрами.

            📌 Два основных алгоритма обхода графа:

            1. DFS (Depth-First Search, поиск в глубину) — идёт вглубь по одному пути, пока не упрётся в тупик, потом возвращается и идёт по следующему пути.

            2. BFS (Breadth-First Search, поиск в ширину) — проходит слой за слоем: сначала все вершины, соединённые с начальной, потом все, соединённые с ними, и так далее.

            📌 Применение:
            • Социальные сети — поиск друзей друзей.
            • Карты — поиск самого короткого пути.
            • Рекомендации — что ещё может понравиться пользователю.

            🎯 В этом уроке ты научишься обходить графы!`,
                    en: `A graph is a set of points (vertices) and lines (edges) between them. Imagine a metro map: stations are vertices, and the lines between them are edges.

            📌 Basic concepts:
            • Vertex — a point in the graph (e.g., a metro station).
            • Edge — a connection between vertices (a metro line).
            • Path — a sequence of vertices connected by edges.

            📌 Two main graph traversal algorithms:

            1. DFS (Depth-First Search) — goes deep along one path until it hits a dead end, then goes back and tries another path.

            2. BFS (Breadth-First Search) — goes layer by layer: first all vertices connected to the starting point, then all connected to them, and so on.

            📌 Applications:
            • Social networks — finding friends of friends.
            • Maps — finding the shortest path.
            • Recommendations — what else might a user like.

            🎯 In this lesson, you'll learn to traverse graphs!`,
                    zh: `图是一组点（顶点）和它们之间的连线（边）。想象地铁地图：车站是顶点，车站之间的线路是边。

            📌 基本概念：
            • 顶点 — 图中的点（例如地铁站）。
            • 边 — 顶点之间的连接（地铁线路）。
            • 路径 — 由边连接的顶点序列。

            📌 两种主要的图遍历算法：

            1. DFS（深度优先搜索）— 沿着一条路径一直走到底，直到遇到死路，然后返回尝试另一条路径。

            2. BFS（广度优先搜索）— 逐层遍历：先访问与起点相连的所有顶点，然后访问与它们相连的所有顶点，依此类推。

            📌 应用：
            • 社交网络 — 查找朋友的朋友。
            • 地图 — 查找最短路径。
            • 推荐 — 用户可能还喜欢什么。

            🎯 在本课中，你将学习遍历图！`
                },

                visited.add(node)
                print(node, end=" ")
                for neighbor in graph[node]:
                    if neighbor not in visited:

                header.appendChild(textSpan);

                const status = document.createElement('span');
                status.className = `task-status ${isDone ? 'done' : ''} ${isBonus ? 'bonus-label' : ''}`;
                status.textContent = isDone ? LANG[getLang()].done : (isBonus ? LANG[getLang()].bonus : LANG[getLang()]
                    .required);
                header.appendChild(status);
                div.appendChild(header);

                const input = document.createElement('textarea');
                input.className = 'task-input';
                input.placeholder = isBonus ? LANG[getLang()].write_code_optional : LANG[getLang()].write_code;
                input.disabled = isDone;
                if (isDone) input.value = task.solution;
                div.appendChild(input);

                const actions = document.createElement('div');
                actions.className = 'task-actions';

                const checkBtn = document.createElement('button');
                checkBtn.className = 'btn-sm primary';
                checkBtn.textContent = LANG[getLang()].check;
                checkBtn.disabled = isDone;
                checkBtn.addEventListener('click', () => {
                    if (isDone) return;
                    const userCode = input.value.trim();
                    if (!userCode) { showTaskResult(div, 'error', LANG[getLang()].write_something); return; }
                    const isCorrect = task.check(userCode);
                    if (isCorrect) {
                        if (!решенныеЗадачи[текущийУрок]) решенныеЗадачи[текущийУрок] = [];
                        решенныеЗадачи[текущийУрок][idx] = true;
                        renderLesson();
                        showTaskResult(div, 'success', LANG[getLang()].correct);
                        addAIMessage(`${LANG[getLang()].task_done_ai} ${idx+1}! ${LANG[getLang()].keep_going}`,
                        'bot');
                        saveProgress();
                    } else {
                        showTaskResult(div, 'error', LANG[getLang()].wrong);
                    }
                });
                actions.appendChild(checkBtn);

                const hintBtn = document.createElement('button');
                hintBtn.className = 'btn-sm ai-hint';
                hintBtn.textContent = LANG[getLang()].ai_hint;
                hintBtn.addEventListener('click', () => {
                    const hint = generateHint(текущийУрок, idx);
                    showTaskResult(div, 'hint', '💡 ' + hint);
                });
                actions.appendChild(hintBtn);

                const resetTaskBtn = document.createElement('button');
                resetTaskBtn.className = 'btn-sm secondary';
                resetTaskBtn.textContent = LANG[getLang()].reset_task;
                resetTaskBtn.addEventListener('click', () => {
                    if (isDone && idx === 0) { showTaskResult(div, 'error', LANG[getLang()].cant_reset); return; }
                    if (isDone) {
                        if (!решенныеЗадачи[текущийУрок]) решенныеЗадачи[текущийУрок] = [];
                        решенныеЗадачи[текущийУрок][idx] = false;
                        renderLesson();
                        saveProgress();
                        return;
                    }
                    input.value = '';
                    hideTaskResult(div);
                });
                actions.appendChild(resetTaskBtn);

                div.appendChild(actions);
                const result = document.createElement('div');
                result.className = 'task-result';
                div.appendChild(result);
                tasksContainer.appendChild(div);
            });
        }

        function showTaskResult(container, type, message) {
            const r = container.querySelector('.task-result');
            r.className = `task-result show ${type}`;
            r.innerHTML = message;
        }

        function hideTaskResult(container) {
            const r = container.querySelector('.task-result');
            r.className = 'task-result';
            r.innerHTML = '';
        }

        function showMainResult(type, message) {
            mainResult.className = `main-result show ${type}`;
            mainResult.textContent = message;
        }

        function hideMainResult() {
            mainResult.className = 'main-result';
            mainResult.textContent = '';
        }

        function updateProgress() {
            const total = LESSONS_DATA.reduce((a, l) => a + l.tasks.length, 0);
            const done = решенныеЗадачи.reduce((a, l) => a + (l ? l.filter(v => v).length : 0), 0);
            progressFill.style.width = (done / total) * 100 + '%';
        }

        function goToLesson(index) {
            if (index < 0 || index >= LESSONS_DATA.length) return;
            const lesson = LESSONS_DATA[index];
            if (lesson.isPaid && !hasPremium) {
                alert(getLang() === 'zh' ? '🔒 高级课程。在 Boosty 上支持项目！' :
                    getLang() === 'ru' ? '🔒 Premium урок. Поддержи проект на Boosty!' :
                    '🔒 Premium lesson. Support on Boosty!');
                return;
            }
            текущийУрок = index;
            hideMainResult();
            renderLesson();
            document.querySelector('.app').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function resetAll() {
            const msg = getLang() === 'zh' ? '重置所有进度？' :
                getLang() === 'ru' ? 'Сбросить весь прогресс?' :
                'Reset all progress?';
            if (confirm(msg)) {
                решенныеЗадачи = LESSONS_DATA.map(l => l.tasks.map(() => false));
                достижения = { firstBlood: false, perfectionist: false, speedDemon: false, scholar: false,
                master: false, supporter: false };
                серия = 0;
                последнееВремяРешения = 0;
                document.querySelectorAll('.achievement').forEach(el => el.classList.remove('unlocked'));
                текущийУрок = 0;
                hideMainResult();
                renderLesson();
                renderNav();
                updateProgress();
                updateAchievements();
                saveProgress();
                addAIMessage(getLang() === 'zh' ? '🔄 进度已重置。' :
                    getLang() === 'ru' ? '🔄 Прогресс сброшен.' :
                    '🔄 Progress reset.', 'bot');
            }
        }

        function nextLesson() {
            if (nextBtn.disabled) return;
            const next = текущийУрок + 1;
            if (next >= LESSONS_DATA.length) {
                showMainResult('success', getLang() === 'zh' ?
                    '🏆 恭喜你！你完成了全部 28 课！👑' :
                    getLang() === 'ru' ?
                    '🏆 ПОЗДРАВЛЯЮ! Ты прошел(а) все 28 уроков! 👑' :
                    '🏆 CONGRATULATIONS! You completed all 28 lessons! 👑');
                nextBtn.disabled = true;
                addAIMessage('🎉🎉🎉 ' + (getLang() === 'zh' ? '你完成了全部课程！' :
                    getLang() === 'ru' ? 'Ты прошел(а) всё!' :
                    'You completed everything!'), 'bot');
                return;
            }
            if (LESSONS_DATA[next].isPaid && !hasPremium) {
                alert(getLang() === 'zh' ? '🔒 高级课程。在 Boosty 上支持项目！' :
                    getLang() === 'ru' ? '🔒 Premium урок. Поддержи проект на Boosty!' :
                    '🔒 Premium lesson. Support on Boosty!');
                return;
            }
            текущийУрок = next;
            hideMainResult();
            renderLesson();
            addAIMessage(`📚 ${getLang() === 'zh' ? '进入下一课' : getLang() === 'ru' ? 'Переходим к уроку' : 'Moving to lesson'} ${next+1}`, 'bot');
            document.querySelector('.app').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.querySelectorAll('[data-hint]').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.hint;
                const map = {
                    'hint': getLang() === 'zh' ? '给我提示' : getLang() === 'ru' ? 'Дай подсказку' : 'Give me a hint',
                    'explain': getLang() === 'zh' ? '解释' : getLang() === 'ru' ? 'Объясни' : 'Explain',
                    'plan': getLang() === 'zh' ? '帮我学习 Python，我知道变量' :
                        getLang() === 'ru' ? 'Помоги изучить Python, я знаю переменные' :
                        'Help me learn Python, I know variables',
                    'fix': getLang() === 'zh' ? '我的代码有错误，帮我修复' :
                        getLang() === 'ru' ? 'Мой код с ошибкой, помоги' :
                        'My code has an error, help'
                };
                const msg = map[type] || '';
                aiInput.value = msg;
                handleAIQuery(msg);
                aiInput.value = '';
            });
        });

        aiSendBtn.addEventListener('click', () => {
            const q = aiInput.value.trim();
            if (!q) return;
            handleAIQuery(q);
            aiInput.value = '';
        });

        aiInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault();
                aiSendBtn.click(); }
        });

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'R') { e.preventDefault();
                resetAll(); }
        });

        window.togglePremium = togglePremium;

        function init() {
            loadProgress();
            const browserLang = navigator.language || 'en';
            const defaultLang = browserLang.startsWith('ru') ? 'ru' : browserLang.startsWith('zh') ? 'zh' : 'en';
            setLanguage(defaultLang);
            renderNav();
            renderLesson();
            updateProgress();
            updateAchievements();
            updatePremiumUI();
            addAIMessage(getLang() === 'zh' ?
                '👋 你好！进度会自动保存！' :
                getLang() === 'ru' ?
                '👋 Привет! Прогресс сохраняется автоматически!' :
                '👋 Hi! Progress is saved automatically!', 'bot');
            console.log('⚔️ PyForge loaded!');
            console.log('📚 28 lessons (20 free, 8 premium)');
            console.log('🌍 3 languages: RU, EN, ZH');
            console.log('💾 Progress saved in localStorage');
            console.log('❤️ Made by Sonya');
        }

        init();
    </script>
</body>
</html>
